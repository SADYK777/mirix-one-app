<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MIRIX One</title>
  <!-- Подключаем Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- TailwindCSS для стилей (лёгкий) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Дополнительные стили */
    body {
      background: #0d0d0d;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .glass {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #6C5CE7, #a29bfe);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary:active {
      transform: scale(0.96);
    }
    input, textarea, select {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      color: #fff;
      padding: 12px 16px;
      width: 100%;
      font-size: 16px;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #6C5CE7;
    }
    .tab-active {
      border-bottom: 3px solid #6C5CE7;
      color: #fff;
    }
    .tab-inactive {
      color: #888;
    }
    .record-card {
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 8px;
      border-left: 4px solid #6C5CE7;
    }
  </style>
</head>
<body>
  <div id="app" class="max-w-md mx-auto px-4 py-6">
    <!-- Шапка -->
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold">MIRIX One</h1>
      <span id="userName" class="text-sm text-gray-400">👤</span>
    </div>

    <!-- Вкладки -->
    <div class="flex border-b border-gray-700 mb-4">
      <button class="tab-btn flex-1 py-2 text-center font-semibold tab-active" data-tab="home">Главная</button>
      <button class="tab-btn flex-1 py-2 text-center font-semibold tab-inactive" data-tab="add">➕ Новая</button>
      <button class="tab-btn flex-1 py-2 text-center font-semibold tab-inactive" data-tab="list">📋 Записи</button>
    </div>

    <!-- Контент вкладок -->
    <div id="tab-home" class="tab-content">
      <!-- Сводка -->
      <div class="glass p-4 mb-4">
        <div class="flex justify-between">
          <div>
            <p class="text-gray-400 text-sm">Доходы</p>
            <p class="text-2xl font-bold text-green-400" id="totalIncome">0 ₽</p>
          </div>
          <div class="text-right">
            <p class="text-gray-400 text-sm">Расходы</p>
            <p class="text-2xl font-bold text-red-400" id="totalExpense">0 ₽</p>
          </div>
        </div>
        <div class="mt-3 text-center">
          <p class="text-gray-400 text-sm">Баланс</p>
          <p class="text-3xl font-bold" id="balance">0 ₽</p>
        </div>
      </div>

      <!-- Быстрые действия -->
      <div class="grid grid-cols-3 gap-3 mb-6">
        <button onclick="switchTab('add')" class="glass p-4 text-center">
          <span class="text-3xl block">💰</span>
          <span class="text-sm">Ручной ввод</span>
        </button>
        <button id="voiceBtn" class="glass p-4 text-center">
          <span class="text-3xl block">🎤</span>
          <span class="text-sm">Голос</span>
        </button>
        <button id="photoBtn" class="glass p-4 text-center">
          <span class="text-3xl block">📸</span>
          <span class="text-sm">Чек</span>
        </button>
      </div>

      <!-- Последние записи -->
      <h3 class="text-lg font-semibold mb-2">Последние записи</h3>
      <div id="recentRecords"></div>
    </div>

    <div id="tab-add" class="tab-content hidden">
      <h2 class="text-xl font-bold mb-4">✏️ Новая запись</h2>
      <form id="addForm">
        <div class="mb-3">
          <label class="block text-sm text-gray-400 mb-1">Тип</label>
          <select id="entryType" class="w-full">
            <option value="expense">Расход</option>
            <option value="income">Доход</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="block text-sm text-gray-400 mb-1">Сумма</label>
          <input type="number" id="entryAmount" placeholder="0" step="0.01" required>
        </div>
        <div class="mb-3">
          <label class="block text-sm text-gray-400 mb-1">Категория</label>
          <select id="entryCategory" class="w-full">
            <option value="Продукты">Продукты</option>
            <option value="Кафе">Кафе</option>
            <option value="Транспорт">Транспорт</option>
            <option value="Жильё">Жильё</option>
            <option value="Покупки">Покупки</option>
            <option value="Здоровье">Здоровье</option>
            <option value="Развлечения">Развлечения</option>
            <option value="Путешествия">Путешествия</option>
            <option value="Подарки">Подарки</option>
            <option value="Образование">Образование</option>
            <option value="Зарплата">Зарплата</option>
            <option value="Подработка">Подработка</option>
            <option value="Переводы">Переводы</option>
            <option value="Прочие доходы">Прочие доходы</option>
            <option value="Другое">Другое</option>
          </select>
        </div>
        <div class="mb-4">
          <label class="block text-sm text-gray-400 mb-1">Описание (необязательно)</label>
          <input type="text" id="entryDescription" placeholder="Что купили?">
        </div>
        <button type="submit" class="btn-primary w-full">Сохранить</button>
      </form>
      <div id="addStatus" class="mt-3 text-sm"></div>
    </div>

    <div id="tab-list" class="tab-content hidden">
      <h2 class="text-xl font-bold mb-4">📋 Все записи</h2>
      <div id="allRecords"></div>
    </div>
  </div>

  <script>
    // ============================================================
    //  НАСТРОЙКИ — URL вашего веб-приложения (скрипта)
    //  ЗАМЕНИТЕ НА ВАШ РЕАЛЬНЫЙ URL
    // ============================================================
    const BACKEND_URL = "https://script.google.com/macros/s/AKfycbwrwANvWlSLr7UT-Cw0t8tVneHOrj1KlbxmK7eslOrtPVkhT9z6jAWvS1r2m8njD8FR1g/exec";

    // ============================================================
    //  ИНИЦИАЛИЗАЦИЯ TELEGRAM WEBAPP
    // ============================================================
    const tg = window.Telegram.WebApp;
    tg.expand(); // разворачиваем на весь экран

    // Получаем данные пользователя
    const user = tg.initDataUnsafe?.user;
    const userId = user?.id || "Unknown";
    const userName = user?.first_name || "Гость";
    document.getElementById('userName').textContent = `👤 ${userName}`;

    // ============================================================
    //  УПРАВЛЕНИЕ ВКЛАДКАМИ
    // ============================================================
    const tabs = {
      home: document.getElementById('tab-home'),
      add: document.getElementById('tab-add'),
      list: document.getElementById('tab-list')
    };
    const tabBtns = document.querySelectorAll('.tab-btn');

    function switchTab(tabName) {
      // Скрыть все
      Object.values(tabs).forEach(el => el.classList.add('hidden'));
      // Показать нужную
      tabs[tabName].classList.remove('hidden');
      // Обновить кнопки
      tabBtns.forEach(btn => {
        btn.classList.remove('tab-active', 'tab-inactive');
        if (btn.dataset.tab === tabName) {
          btn.classList.add('tab-active');
        } else {
          btn.classList.add('tab-inactive');
        }
      });
      // Если переключились на главную или список — обновить данные
      if (tabName === 'home' || tabName === 'list') {
        loadRecords();
      }
    }

    tabBtns.forEach(btn => {
      btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });

    // ============================================================
    //  РАБОТА С ЗАПИСЯМИ
    // ============================================================

    // Загрузить записи с бэкенда
    async function loadRecords() {
      try {
        const response = await fetch(BACKEND_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'get_records',
            userId: userId,
            period: 'month' // можно заменить на 'day', 'week', 'year'
          })
        });
        const data = await response.json();
        if (data.records) {
          displayRecords(data.records);
          updateSummary(data.records);
        } else {
          console.warn('Нет записей или ошибка', data);
        }
      } catch (err) {
        console.error('Ошибка загрузки записей:', err);
      }
    }

    // Отобразить записи на главной и в списке
    function displayRecords(records) {
      // Последние 5 для главной
      const recent = records.slice(-5).reverse();
      const recentContainer = document.getElementById('recentRecords');
      if (recent.length === 0) {
        recentContainer.innerHTML = '<p class="text-gray-500 text-sm">Пока нет записей. Добавьте первую!</p>';
      } else {
        recentContainer.innerHTML = recent.map(r => `
          <div class="record-card flex justify-between">
            <div>
              <span class="font-semibold">${r.category}</span>
              <span class="text-sm text-gray-400 ml-2">${r.description || ''}</span>
            </div>
            <span class="${r.type === 'income' ? 'text-green-400' : 'text-red-400'} font-bold">
              ${r.type === 'income' ? '+' : '-'} ${r.amount} ₽
            </span>
          </div>
        `).join('');
      }

      // Все записи для вкладки "Записи"
      const allContainer = document.getElementById('allRecords');
      if (records.length === 0) {
        allContainer.innerHTML = '<p class="text-gray-500 text-sm">Нет записей.</p>';
      } else {
        allContainer.innerHTML = records.slice().reverse().map(r => `
          <div class="record-card flex justify-between">
            <div>
              <span class="font-semibold">${r.category}</span>
              <span class="text-sm text-gray-400 ml-2">${r.description || ''}</span>
              <span class="text-xs text-gray-500 block">${new Date(r.date).toLocaleDateString()}</span>
            </div>
            <span class="${r.type === 'income' ? 'text-green-400' : 'text-red-400'} font-bold">
              ${r.type === 'income' ? '+' : '-'} ${r.amount} ₽
            </span>
          </div>
        `).join('');
      }
    }

    // Обновить сводку
    function updateSummary(records) {
      let totalIncome = 0, totalExpense = 0;
      records.forEach(r => {
        if (r.type === 'income') totalIncome += parseFloat(r.amount);
        else totalExpense += parseFloat(r.amount);
      });
      document.getElementById('totalIncome').textContent = totalIncome.toFixed(2) + ' ₽';
      document.getElementById('totalExpense').textContent = totalExpense.toFixed(2) + ' ₽';
      document.getElementById('balance').textContent = (totalIncome - totalExpense).toFixed(2) + ' ₽';
    }

    // ============================================================
    //  ДОБАВЛЕНИЕ ЗАПИСИ (РУЧНОЙ ВВОД)
    // ============================================================
    document.getElementById('addForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const type = document.getElementById('entryType').value;
      const amount = parseFloat(document.getElementById('entryAmount').value);
      const category = document.getElementById('entryCategory').value;
      const description = document.getElementById('entryDescription').value.trim();

      if (!amount || amount <= 0) {
        document.getElementById('addStatus').innerHTML = '<span class="text-red-400">Введите корректную сумму</span>';
        return;
      }

      // Формируем текст для бэкенда (он будет парсить через Gemini)
      const text = `${category} ${description} ${amount} ${type === 'income' ? 'доход' : 'расход'}`;

      try {
        const response = await fetch(BACKEND_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'add_entry',
            userId: userId,
            text: text,
            // также можно передать отдельные поля, но бэкенд сам распарсит
          })
        });
        const data = await response.json();
        if (data.success) {
          document.getElementById('addStatus').innerHTML = '<span class="text-green-400">✅ Запись добавлена!</span>';
          document.getElementById('addForm').reset();
          loadRecords(); // обновить списки
          // Можно переключиться на главную
          switchTab('home');
        } else {
          document.getElementById('addStatus').innerHTML = `<span class="text-red-400">❌ Ошибка: ${data.error || 'неизвестная'}</span>`;
        }
      } catch (err) {
        document.getElementById('addStatus').innerHTML = `<span class="text-red-400">❌ Ошибка сети: ${err.message}</span>`;
      }
    });

    // ============================================================
    //  ГОЛОСОВОЙ ВВОД (через MediaRecorder)
    // ============================================================
    document.getElementById('voiceBtn').addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const mediaRecorder = new MediaRecorder(stream);
        const audioChunks = [];

        mediaRecorder.addEventListener('dataavailable', event => {
          audioChunks.push(event.data);
        });

        mediaRecorder.addEventListener('stop', async () => {
          const audioBlob = new Blob(audioChunks, { type: 'audio/ogg; codecs=opus' });
          // Для простоты — отправляем аудио на бэкенд, но Apps Script не умеет принимать файлы напрямую.
          // Поэтому лучше отправлять голос в Telegram бота, а Mini App только инициирует запись.
          // Для демонстрации пока просто покажем сообщение.
          alert('Голос записан. Отправьте его боту в Telegram!');
          // Здесь можно было бы отправить blob на сервер, но Apps Script не поддерживает multipart.
          // Поэтому рекомендуем использовать бота для голосовых.
          stream.getTracks().forEach(track => track.stop());
        });

        mediaRecorder.start();
        setTimeout(() => mediaRecorder.stop(), 5000); // запись 5 секунд
      } catch (err) {
        alert('Нет доступа к микрофону или ошибка: ' + err.message);
      }
    });

    // ============================================================
    //  ФОТО ЧЕКА (через загрузку файла)
    // ============================================================
    document.getElementById('photoBtn').addEventListener('click', () => {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        // Читаем как base64 (для отправки в скрипт)
        const reader = new FileReader();
        reader.onload = async (event) => {
          const base64 = event.target.result.split(',')[1]; // только данные
          // Отправляем на бэкенд для OCR
          try {
            const response = await fetch(BACKEND_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                action: 'ocr',
                image: base64
              })
            });
            const data = await response.json();
            if (data.success) {
              // Автозаполняем форму
              document.getElementById('entryAmount').value = data.amount || '';
              document.getElementById('entryCategory').value = data.category || 'Другое';
              document.getElementById('entryDescription').value = data.merchant || '';
              switchTab('add');
            } else {
              alert('Не удалось распознать чек: ' + (data.error || ''));
            }
          } catch (err) {
            alert('Ошибка распознавания: ' + err.message);
          }
        };
        reader.readAsDataURL(file);
      };
      input.click();
    });

    // ============================================================
    //  ЗАГРУЗКА ПРИ СТАРТЕ
    // ============================================================
    loadRecords();
  </script>
</body>
</html>
